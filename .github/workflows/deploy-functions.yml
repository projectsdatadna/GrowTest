name: Deploy Firebase Functions

# Auto-deploys the API (functions/index.js) to the shared `devgraders`
# Firebase project whenever functions/** changes land on main.
# See FIREBASE_DEPLOY.md for the one-time secrets + CI-auth setup this
# workflow depends on.

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install functions dependencies
        working-directory: functions
        run: npm ci

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEVGRADERS }}

      - name: Deploy to Firebase Cloud Functions (scoped to :api only)
        # IMPORTANT: devgraders is a shared project used by other apps.
        # Never widen this to a bare `--only functions` — see FIREBASE_DEPLOY.md.
        run: npx firebase-tools deploy --only functions:api --project devgraders --non-interactive
