name: Deploy Firebase Functions

# Auto-deploys the API (functions/index.js) to the shared `dev-cogniglob`
# Firebase project whenever functions/** changes land on main.
# See FIREBASE_DEPLOY.md for the one-time secrets + CI-auth setup this
# workflow depends on.

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install functions dependencies
        working-directory: functions
        run: npm ci

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV_COGNIGLOB }}

      - name: Deploy to Firebase Cloud Functions (scoped to this app's functions only)
        # IMPORTANT: dev-cogniglob is a shared project used by other apps.
        # Never widen this to a bare `--only functions` — see FIREBASE_DEPLOY.md.
        # The HTTP function is `growtestApi`, NOT `api` — dev-cogniglob already
        # has its own unrelated `api` function; naming ours the same caused a
        # real incident on the previous shared project (devgraders).
        run: npx firebase-tools deploy --only functions:growtestApi,functions:watchlistTick,functions:watchlistCleanup --project dev-cogniglob --non-interactive
