name: Deploy Frontend (Firebase Hosting)

# Auto-deploys the built React UI to the dedicated `groww-dashboard` Firebase
# Hosting site (target: groww-dashboard-ui) whenever frontend source changes
# land on main. Uses the same dev-cogniglob project as the API, but a
# separate Hosting site so this never touches other apps' Hosting content
# there (dev-cogniglob's own default site already serves an unrelated app).

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - '.env.production'
      - '.github/workflows/deploy-ui.yml'
      - 'firebase.json'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV_COGNIGLOB }}

      - name: Deploy to Firebase Hosting (groww-dashboard-ui target only)
        # IMPORTANT: dev-cogniglob is a shared project. This deploys to the
        # dedicated `groww-dashboard` site only, via the groww-dashboard-ui
        # target in .firebaserc - never the project's shared default Hosting
        # site (which serves an unrelated app).
        run: npx firebase-tools deploy --only hosting:groww-dashboard-ui --project dev-cogniglob --non-interactive
